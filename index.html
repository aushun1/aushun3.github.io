<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Dark Academia Music Player </title>
    <link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.3.1/css/all.css'><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <HTML>
<head>
    <link rel="stylesheet" href="style.css">
<div id="player-bg-artwork"></div>
<div id="player-bg-layer"></div>
<div id="player-container">
  <div id="player">
    <div id="player-track">
      <div id="album-name"></div>
      <div id="track-name"></div>
      <div id="track-time">
        <div id="current-time"></div>
        <div id="track-length"></div>
      </div>
      <div id="seek-bar-container">
        <div id="seek-time"></div>
        <div id="s-hover"></div>
        <div id="seek-bar"></div>
      </div>
    </div>
    <div id="player-content">
      <div id="album-art">

        <img src="https://i.pinimg.com/736x/b4/65/fb/b465fbd27b3756a5704a20ecaff99ad4.jpg" id="_9" />

        <img src="https://i.pinimg.com/736x/da/75/bb/da75bb0db4711098211b04f9445e4f75.jpg" id="_12" />

        <img src="https://i.pinimg.com/736x/24/44/d2/2444d232327f3a8bd8adb9f71144a802.jpg" id="_18" />

      </div>
      <div id="player-controls">
        <div class="control">
          <div class="button" id="play-previous">
            <i class="fas fa-backward"></i>
          </div>
        </div>
        <div class="control">
          <div class="button" id="play-pause-button">
            <i class="fas fa-play"></i>
          </div>
        </div>
        <div class="control">
          <div class="button" id="play-next">
            <i class="fas fa-forward"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
